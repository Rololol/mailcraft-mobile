name: MailCraft Android

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-demo.yml"
      - "apps/mailcraft-android/**"
      - "crates/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Build and verify Android
        run: cargo run --locked --package xtask -- mobile

      - name: Prepare release APK
        run: |
          mkdir -p dist/release
          RELEASE_APK="apps/mailcraft-android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$RELEASE_APK"
          cp "$RELEASE_APK" dist/release/MailCraft-Android-Release-unsigned.apk
          test -s dist/release/MailCraft-Android-Release-unsigned.apk
          sha256sum dist/release/MailCraft-Android-Release-unsigned.apk > dist/release/SHA256SUMS.txt

      - name: Prepare debug APK for testing
        run: |
          mkdir -p dist/debug
          cp apps/mailcraft-android/app/build/outputs/apk/debug/app-debug.apk dist/debug/MailCraft-Android-Debug.apk
          test -s dist/debug/MailCraft-Android-Debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MailCraft-Android-Release-Unsigned
          path: dist/release/*
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MailCraft-Android-Debug
          path: dist/debug/MailCraft-Android-Debug.apk
          retention-days: 14
